<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ToDoリスト</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 40px 16px;
      background: #f2f4f8;
      font-family: "Hiragino Sans", "Meiryo", sans-serif;
      color: #333;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
      padding: 24px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin: 0 0 20px;
      font-size: 24px;
      text-align: center;
    }

    .form {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .form input {
      flex: 1;
      padding: 10px 12px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
      outline: none;
    }

    .form input:focus {
      border-color: #4a7dff;
    }

    .form button {
      padding: 10px 16px;
      font-size: 16px;
      color: #fff;
      background: #4a7dff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .form button:hover {
      background: #3366e6;
    }

    .count {
      margin: 0 0 12px;
      font-size: 14px;
      color: #666;
      text-align: right;
    }

    .list {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 12px;
      margin-bottom: 8px;
      background: #fafafa;
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
    }

    .item-text {
      flex: 1;
      cursor: pointer;
      word-break: break-all;
    }

    .item.done .item-text {
      text-decoration: line-through;
      color: #aaa;
    }

    .delete-btn {
      padding: 6px 10px;
      font-size: 14px;
      color: #fff;
      background: #ff5c5c;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .delete-btn:hover {
      background: #e04444;
    }

    .empty {
      color: #999;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>ToDoリスト</h1>

    <form class="form" id="todo-form">
      <input type="text" id="todo-input" placeholder="タスクを入力" autocomplete="off">
      <button type="submit">追加</button>
    </form>

    <p class="count" id="todo-count"></p>

    <ul class="list" id="todo-list"></ul>
  </div>

  <script>
    // タスクを管理する配列
    const todos = [];

    const form = document.getElementById("todo-form");
    const input = document.getElementById("todo-input");
    const list = document.getElementById("todo-list");
    const count = document.getElementById("todo-count");

    // 配列の内容をもとに画面を描画する
    function render() {
      list.innerHTML = "";

      // 完了件数 / 総件数
      const doneCount = todos.filter((todo) => todo.done).length;
      count.textContent = `完了 ${doneCount} / ${todos.length} 件`;

      if (todos.length === 0) {
        const empty = document.createElement("li");
        empty.className = "empty";
        empty.textContent = "タスクはありません";
        list.appendChild(empty);
        return;
      }

      todos.forEach((todo, index) => {
        const li = document.createElement("li");
        li.className = "item";
        if (todo.done) {
          li.classList.add("done");
        }

        // タスク名（クリックで完了／未完了を切り替え）
        const span = document.createElement("span");
        span.className = "item-text";
        span.textContent = todo.text;
        span.addEventListener("click", () => {
          todos[index].done = !todos[index].done;
          render();
        });

        // 削除ボタン
        const deleteBtn = document.createElement("button");
        deleteBtn.className = "delete-btn";
        deleteBtn.textContent = "削除";
        deleteBtn.addEventListener("click", () => {
          todos.splice(index, 1);
          render();
        });

        li.appendChild(span);
        li.appendChild(deleteBtn);
        list.appendChild(li);
      });
    }

    // タスクを追加する
    form.addEventListener("submit", (event) => {
      event.preventDefault();

      const text = input.value.trim();
      if (text === "") {
        return;
      }

      todos.push({ text: text, done: false });
      input.value = "";
      render();
    });

    render();
  </script>
</body>
</html>
